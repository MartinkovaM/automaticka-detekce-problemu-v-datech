\u00b3\n&quot;NMHC(GT) BETWEEN 0 AND 1200&quot;\n\n-- Hodnota C6H6(GT) mus\u00ed b\u00fdt v rozsahu 0 a\u017e 60 \u00b5g/m\u00b3\n&quot;C6H6(GT) BETWEEN 0.0 AND 60.0&quot;\n\n-- Hodnota NOx(GT) mus\u00ed b\u00fdt mezi 0 a 1500 ppb\n&quot;NOx(GT) BETWEEN 0 AND 1500&quot;\n\n-- Hodnota NO2(GT) mus\u00ed b\u00fdt mezi 0 a 500 \u00b5g/m\u00b3\n&quot;NO2(GT) BETWEEN 0 AND 500&quot;\n```\n\n---\n\n### \u2705 **Povinn\u00e1 hodnota (Not Null Check)**\n\n```sql\n-- Hodnota CO(GT) nesm\u00ed b\u00fdt pr\u00e1zdn\u00e1\n&quot;CO(GT) IS NOT NULL&quot;\n```\n\n---\n\n### \ud83d\udcc8 **Korela\u010dn\u00ed kontroly (pro analytick\u00e9 \u00fa\u010dely, nelze p\u0159\u00edmo jako SQL WHERE bez p\u0159edv\u00fdpo\u010dtu korelace)**\n\n&gt; Tyto kontroly je t\u0159eba prov\u00e9st analyticky (nap\u0159. pomoc\u00ed `CORR()` v PostgreSQL nebo Pearsonovy korelace ve skriptech), nikoliv jako jednoduch\u00e9 SQL filtry:\n\n```sql\n-- Pearsonova korelace mezi CO(GT) a NMHC(GT) mus\u00ed b\u00fdt &gt;= 0.85\nSELECT CORR(&quot;CO(GT)&quot;, &quot;NMHC(GT)&quot;) FROM tabulka;\n\n-- Korelace mezi C6H6(GT) a PT08.S2(NMHC) mus\u00ed b\u00fdt \u2265 0.95\nSELECT CORR(&quot;C6H6(GT)&quot;, &quot;PT08.S2(NMHC)&quot;) FROM tabulka;\n\n-- Korelace mezi PT08.S1(CO) a PT08.S2(NMHC) mus\u00ed b\u00fdt \u2265 0.9\nSELECT CORR(&quot;PT08.S1(CO)&quot;, &quot;PT08.S2(NMHC)&quot;) FROM tabulka;\n```\n\n---\n\n### \ud83e\uddee **Odvozen\u00e1 hodnota (Derived Value Check)**\n\n```sql\n-- Absolutn\u00ed vlhkost AH by m\u011bla odpov\u00eddat teplot\u011b T a relativn\u00ed vlhkosti RH (\u00b10.1)\n&quot;ABS(AH - 0.0023 * RH * EXP(0.061 * T)) &lt; 0.1&quot;\n```\n\n---\n\n### \u2733\ufe0f **Kompletn\u00ed seznam pro WHERE nebo CASE validace:**\n\nNap\u0159\u00edklad ve form\u011b v\u00fdpisu z\u00e1znam\u016f s chybou:\n\n```sql\nSELECT *\nFROM tabulka\nWHERE NOT (\n    &quot;CO(GT)&quot; BETWEEN 0.0 AND 11.0 AND\n    &quot;NMHC(GT)&quot; BETWEEN 0 AND 1200 AND\n    &quot;C6H6(GT)&quot; BETWEEN 0.0 AND 60.0 AND\n    &quot;NOx(GT)&quot; BETWEEN 0 AND 1500 AND\n    &quot;NO2(GT)&quot; BETWEEN 0 AND 500 AND\n    &quot;CO(GT)&quot; IS NOT NULL AND\n    ABS(AH - 0.0023 * RH * EXP(0.061 * T)) &lt; 0.1\n);\n```\n\nPokud chce\u0161, mohu p\u0159ipravit i \u0161ablonu pro generov\u00e1n\u00ed v\u00fdstupn\u00ed tabulky s ozna\u010den\u00edm, kter\u00e1 pravidla byla poru\u0161ena. Sta\u010d\u00ed \u0159\u00edct."]}, "status": "finished_successfully", "end_turn": true, "weight": 1.0, "metadata": {"finish_details": {"type": "stop", "stop_tokens": [200002]}, "is_complete": true, "citations": [], "content_references": [], "message_type": null, "model_slug": "gpt-4o", "default_model_slug": "gpt-4o", "parent_id": "211478fd-3535-45c0-a17a-077d3a58b057", "request_id": "954ec9466a4358b7-DFW", "timestamp_": "absolute"}, "recipient": "all", "channel": null}, "parent": "211478fd-3535-45c0-a17a-077d3a58b057", "children": []}}, "moderation_results": [], "current_node": "4e66b733-4f61-457c-9d63-4de6ec20c8cb", "plugin_ids": null, "conversation_id": "685b02d3-1338-800d-8535-7692389996e5", "conversation_template_id": null, "gizmo_id": null, "gizmo_type": null, "is_archived": false, "is_starred": null, "safe_urls": [], "blocked_urls": [], "default_model_slug": "gpt-4o", "conversation_origin": null, "voice": null, "async_status": null, "disabled_tool_ids": [], "is_do_not_remember": false, "memory_scope": "global_enabled", "sugar_item_id": null, "id": "685b02d3-1338-800d-8535-7692389996e5"}]
      var assetsJson = null


      function getConversationMessages(conversation) {
          var messages = [];
          var currentNode = conversation.current_node;
          while (currentNode != null) {
              var node = conversation.mapping[currentNode];
              if (
                  node.message &&
                  node.message.content &&
                  node.message.content.parts &&
                  node.message.content.parts.length > 0 &&
                  (node.message.author.role !== "system"  || node.message.metadata.is_user_system_message)
              ) {
                  author = node.message.author.role;
                  if (author === "assistant" || author === "tool") {
                      author = "ChatGPT";
                  } else if (author === "system" && node.message.metadata.is_user_system_message) {
                      author = "Custom user info"
                  }
                  if (node.message.content.content_type == "text" || node.message.content.content_type == "multimodal_text") {
                    var parts = [];
                    for (var i = 0; i < node.message.content.parts.length; i++) {
                      var part = node.message.content.parts[i];
                      if (typeof part === "string" && part.length > 0) {
                        parts.push({text: part});
                      } else if (part.content_type == "audio_transcription") {
                        parts.push({transcript: part.text});
                      } else if (part.content_type == "audio_asset_pointer" || part.content_type == "image_asset_pointer" || part.content_type == "video_container_asset_pointer") {
                        parts.push({asset: part});
                      } else if (part.content_type == "real_time_user_audio_video_asset_pointer") {
                        if (part.audio_asset_pointer) {
                          parts.push({asset: part.audio_asset_pointer});
                        }
                        if (part.video_container_asset_pointer) {
                          parts.push({asset: part.video_container_asset_pointer});
                        }
                        for (var j = 0; j < part.frames_asset_pointers.length; j++) {
                          parts.push({asset: part.frames_asset_pointers[j]});
                        }
                      }
                    }
                    if (parts.length > 0) {
                      messages.push({ author, parts: parts });
                    }
                  }
              }
              currentNode = node.parent;
          }
          return messages.reverse();
      }

      // on load, add messages to the root div
      window.onload = function() {
          var root = document.getElementById("root");
          for (var i = 0; i < jsonData.length; i++) {
              var conversation = jsonData[i];
              var messages = getConversationMessages(conversation);
              var div = document.createElement("div");
              div.className = "conversation";
              div.innerHTML = "<h4>" + conversation.title + "</h4>";
              for (var j = 0; j < messages.length; j++) {
                  var message = document.createElement("pre");
                  message.className = "message";
                  message.innerHTML = `<div class="author">${messages[j].author}</div>`
                  if (messages[j].parts) {
                    for (var k = 0; k < messages[j].parts.length; k++) {
                      var part = messages[j].parts[k];
                      if (part.text) {
                        message.innerHTML += `<div>${part.text}</div>`;
                      } else if (assetsJson) {
                        if (part.transcript) {
                          message.innerHTML += `<div>[Transcript]: ${part.transcript}</div>`;
                        } else if (part.asset) {
                          var link = assetsJson[part.asset.asset_pointer];
                          if (link) {
                            message.innerHTML += `<div>[File]: <a href="${link}">${link}</a></div>`;
                          } else {
                            message.innerHTML += `<div>[File]: -Deleted-</div>`;
                          }
                        }
                      }
                    }
                  }
                  div.appendChild(message);
              }
              root.appendChild(div);
          }
      }
    </script>
